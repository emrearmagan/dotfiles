edge center-sized
background_opacity 1
kitty_override draw_window_borders_for_single_window=yes
kitty_override window_border_width=1pt
kitty_override window_padding_width=6
kitty_override draw_minimal_borders=no
kitty_override window_border_radius=8pt
# A small outer margin prevents rounded borders from blanking the popup.
kitty_override window_margin_width=1
