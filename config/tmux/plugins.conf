set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'laktak/extrakto' # prefix + tab to start extrakto
set -g @plugin 'MunifTanjim/tmux-suspend' # press F12 to suspend tmux keys
set -g @plugin 'and-rs/flash.tmux'
set -g @flash-key 'g'

set -g @plugin 'tmux-plugins/tmux-resurrect' # prefix + Ctrl-s to save, prefix + Ctrl-r to restore
set -g @plugin 'tmux-plugins/tmux-continuum' # saves every 15 minutes
set -g @continuum-restore 'on'
