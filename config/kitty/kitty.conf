# Font
font_family postscript_name=JetBrainsMonoNF-Regular
bold_font postscript_name=JetBrainsMonoNF-Bold
italic_font postscript_name=JetBrainsMonoNF-Italic
bold_italic_font postscript_name=JetBrainsMonoNF-BoldItalic
font_size 13.0
modify_font cell_height -1px

# Appearance
include themes/catppuccin-mocha.conf
background #181825
background_opacity 1.0
window_padding_width 0
placement_strategy top-left
hide_window_decorations titlebar-only
cursor_shape block
cursor_blink_interval 0
cursor_trail 1

# Tabs
tab_bar_edge top
tab_bar_min_tabs 2
tab_bar_align left
tab_bar_style powerline
tab_powerline_style round
tab_title_max_length 15
active_tab_font_style normal
inactive_tab_font_style normal
active_tab_foreground #181825
active_tab_background #7aa2f7
inactive_tab_foreground #7aa2f7
inactive_tab_background #181825
tab_bar_background #181825

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+shift+h previous_tab
map cmd+shift+l next_tab

# tmux: kitty can't pass ctrl+shift+letter, so send prefix (ctrl+a) + key instead
map ctrl+shift+h combine : send_key ctrl+a : send_key p
map ctrl+shift+l combine : send_key ctrl+a : send_key n

# Behavior
scrollback_lines 10000
enable_audio_bell no
macos_option_as_alt yes
